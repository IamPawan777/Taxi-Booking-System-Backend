services: 
  springbootapp:
    image: springboot-image:v1
    container_name: springboot-container
    build:
      context: .
      dockerfile: Dockerfile 
    ports:
      - 9090:9090
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/springboot_Texi_Booking
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: IamPawan
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - quicktrip-network

  mysqldb:
    image: mysql:8.0
    container_name: db-container
    environment:
      MYSQL_ROOT_PASSWORD: IamPawan
      MYSQL_DATABASE: springboot_Texi_Booking
      MYSQL_PASSWORD: IamPawan
    ports:
      - "3308:3306"
    volumes:
      - quicktrip-mysql_data:/var/lib/mysql
    networks:
      - quicktrip-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  quicktrip-mysql_data:

networks:
  quicktrip-network:
    driver: bridge
